<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daiane Stefano Nutrição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet luxury, a nutritionist's private boutique
   IDEA: an editorial shop page, like a premium magazine's shopping column
   PICTURE: arched portrait with a hairline champagne ring, then large product photos
   COLOUR and TYPE: ivory ground, deep brand green ink, champagne gold hairlines; Cormorant Garamond + Jost
   LAYOUT: slim bar with logo and categories, centred intro, airy product grid, small print */
:root{color-scheme:light dark;
--bg:light-dark(#fbf9f5,#101714);--card:light-dark(#ffffff,#16201c);--ink:light-dark(#1e4034,#ece8df);
--text:light-dark(#2b2b28,#e6e2d9);--soft:light-dark(#7a766d,#a7a397);--gold:light-dark(#b8975a,#cdb07a);
--sand:light-dark(#f3eee6,#1c2622);--line:light-dark(#e9e2d5,#26312c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font:300 16px/1.65 Jost,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto}
.pad{padding-inline:max(5vw,18px)}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:24px;align-items:center;padding-block:12px}
.brand{flex:none;display:block;background:light-dark(transparent,#fbf9f5);border-radius:8px;padding:2px 6px}
.brand img{height:44px;width:auto;display:block}
.jump{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:flex-end}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;display:flex;align-items:center;min-height:40px;text-decoration:none;color:var(--soft);font:400 12.5px Jost;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.jump a:hover,.jump a.on{color:var(--ink);border-bottom-color:var(--gold)}
.jump a:focus-visible,.card:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.shop{padding-top:clamp(34px,6vw,64px)}
.hello{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;max-width:520px;margin:0 auto}
.hello>div{display:flex;flex-direction:column;align-items:inherit;gap:10px}
.hello img{width:104px;height:130px;object-fit:cover;border-radius:52px 52px 14px 14px;outline:1px solid var(--gold);outline-offset:5px;display:block}
.hello .kick{font:400 11.5px Jost;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:6px 0 0}
.hello h2{font:500 clamp(34px,5vw,48px)/1.05 'Cormorant Garamond',Georgia,serif;color:var(--ink);margin:0}
.hello h2 em{font-style:italic}
.hello p{margin:0;color:var(--soft);font-size:16px}
.sec{padding-top:clamp(44px,6vw,72px)}
.sec h3{font:400 12.5px Jost;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);margin:0 0 22px;display:flex;align-items:center;gap:16px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:36px 22px}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.thumb{background:var(--sand);border-radius:6px;aspect-ratio:1/1;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.card:hover .thumb img{transform:scale(1.04)}
.card h4{font:500 20px/1.2 'Cormorant Garamond',Georgia,serif;color:var(--ink);margin:4px 0 0}
.tip{font-size:14px;line-height:1.5;color:var(--soft);margin:0;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.buy{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:40px;font:400 12.5px Jost;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--gold)}
.buy::after{content:"→";letter-spacing:0;transition:transform .2s}
.card:hover .buy::after{transform:translateX(4px)}
.empty{padding:40px 0;text-align:center;color:var(--soft)}
.note{font-size:10.5px;line-height:1.5;color:var(--soft);max-width:560px;margin:56px auto 0;text-align:center;opacity:.75}
footer{padding-block:20px 40px;font:400 11.5px Jost;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);text-align:center}
@media(max-width:600px){html{scroll-padding-top:118px}.bar .wrap{flex-wrap:wrap;gap:6px;justify-content:center}.jump{flex-basis:100%;justify-content:flex-start;gap:18px}.brand img{height:38px}.grid{grid-template-columns:1fr 1fr;gap:28px 12px}.card h4{font-size:17px}.tip{font-size:13px;-webkit-line-clamp:1}.buy{font-size:11px;letter-spacing:.14em}.shop{padding-top:22px}.hello{flex-direction:row;text-align:left;align-items:center;gap:16px;max-width:none}.hello>div{display:flex;flex-direction:column;gap:2px;align-items:flex-start}.hello img{width:68px;height:86px;border-radius:34px 34px 10px 10px;outline-offset:4px;flex:none}.hello .kick{margin:0;font-size:10.5px}.hello h2{font-size:28px}.hello p{font-size:14px;line-height:1.45}.sec{padding-top:34px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.thumb img,.jump a{transition:none}.card:hover .thumb img{transform:none}}
</style>
</head>
<body>


<div class="bar"><div class="wrap pad">
  <a class="brand" href="#loja"><img src="img/logo.png" alt="Daiane Stefano Nutrição"></a>
  <nav class="jump" id="jump" aria-label="Categorias da loja"></nav>
</div></div>

<main class="wrap pad">
  <section class="shop" id="loja">
    <div class="hello"><img src="img/daiane.jpg" alt="Daiane Stefano, Nutricionista"><div><p class="kick">Seleção da nutri</p><h2>Facilite sua <em>rotina</em></h2>
    <p>Oi, eu sou a Daiane, Nutricionista. Separei o que facilita a rotina de quem quer comer bem.</p></div></div>
    <div id="list"></div>
  </section>
  <p class="note">Nenhum produto substitui orientação nutricional individual. Preços e disponibilidade são definidos por cada loja e podem mudar.</p>
</main>
<footer class="wrap pad">Daiane Stefano Nutrição</footer>

<script>
{
const CATS=[
 {id:'marmita',name:'Marmitas e potes',sub:'Para preparar a semana e manter a geladeira em ordem.'},
 {id:'levar',name:'Leve com você',sub:'Bolsas térmicas para o trabalho, a faculdade e o treino.'},
 {id:'cozinha',name:'Cozinha prática',sub:'Utensílios que economizam tempo no preparo.'},
 {id:'agua',name:'Hidratação',sub:'Garrafas e copos para ter água sempre por perto.'},
 {id:'lanche',name:'Lanches proteicos',sub:'Opções práticas para levar na bolsa.'},
 {id:'supl',name:'Suplementos',sub:'Marcas conhecidas, com rótulo limpo.'}
];
/* Para adicionar produto: copie uma linha e troque nome (n), categoria (c), link (u), descrição (t) e ícone (i). */
const P=[
 {n:'Kit potes de vidro com divisória',c:'marmita',u:'https://meli.la/1hjigWm',t:'Dois compartimentos e tampa com travas: proteína de um lado, acompanhamento do outro.',i:'box',img:'img/potes-vidro-divisoria.jpg',f:1},
 {n:'Kit 5 marmitas de vidro com divisória',c:'marmita',u:'https://meli.la/2rfQ4Hm',t:'Cinco marmitas para montar a semana inteira de uma vez, com prato principal e salada separados.',i:'box',img:'img/marmitas-vidro-5.jpg',f:1},
 {n:'Garrafa térmica Stanley rosa',c:'agua',u:'https://meli.la/1DhA2GR',t:'Tampa que abre com um toque e aço inox que mantém a água gelada por horas.',i:'bottle',img:'img/stanley-rosa.jpg',f:1},
 {n:'Garrafa térmica com canudo embutido rosa',c:'agua',u:'https://meli.la/1F35hGp',t:'Não vaza, tem canudo embutido e mantém a água gelada por até 24 horas.',i:'bottle',img:'img/garrafa-canudo-rosa.jpg'},
 {n:'Bolsa térmica Everbags preta',c:'levar',u:'https://meli.la/1bVMyCM',t:'Compacta, com alça de mão e de ombro: leva a marmita e o lanche para o trabalho ou o treino.',i:'bag',img:'img/everbags-preta.jpg'},
 {n:'Bolsa térmica Usemimeria preta',c:'levar',u:'https://meli.la/295phB3',t:'Visual elegante em material liso, com bolso frontal e alça de ombro. Combina com o escritório.',i:'bag',img:'img/usemimeria-preta.jpg'},
 {n:'Potinhos de vidro 200ml com tampa',c:'marmita',u:'https://meli.la/25ZJHhm',t:'Tamanho ideal para deixar frutas picadas porcionadas na geladeira, prontas para o lanche.',i:'jar',img:'img/potes-leite-materno.jpg'},
 {n:'Kit potinhos de vidro 200ml com tampa de rosca',c:'marmita',u:'https://meli.la/2PBhKA5',t:'Vários potinhos graduados para porcionar frutas, iogurte e lanches da semana de uma vez.',i:'jar',img:'img/potes-super-mamae.jpg'},
 {n:'Creatina monohidratada Nutrify 300g',c:'supl',u:'https://meli.la/12SmE1m',t:'Creatina 100% monohidratada, sem açúcar e sem glúten, em pote de 300g.',i:'jar',img:'img/creatina-nutrify.jpg'},
 {n:'Creatina monohidratada Nutrify 600g',c:'supl',u:'https://meli.la/1vTzQG2',t:'Creatina pura em pote maior, com 200 porções de 3g. Rende mais por compra.',i:'jar',img:'img/creatina-nutrify-600.jpg'},
 {n:'Whey Protein +Mu Paçoquita 450g',c:'supl',u:'https://meli.la/1Tb4VtB',t:'Sabor paçoca, com 18g de proteína por dose. Fácil de levar para o lanche.',i:'jar',img:'img/whey-mu-pacoquita.jpg'},
 {n:'Whey Protein +Mu Cookies’n Cream 900g',c:'supl',u:'https://meli.la/1n4iCev',t:'Sabor cookies’n cream, com 20g de proteína por dose, em embalagem de 900g.',i:'jar',img:'img/whey-mu-cookies.jpg'},
 {n:'Proteína Vegetal +Mu Torta de Banana com Canela 450g',c:'supl',u:'https://meli.la/25YgKmb',t:'Proteína de origem vegetal, com 22g por dose, sabor torta de banana com canela.',i:'jar',img:'img/proteina-vegetal-banana.jpg'},
 {n:'Choco Wheyfer +Mu chocolate com coco, caixa com 12',c:'lanche',u:'https://meli.la/1wrKFL8',t:'Wafer coberto com 6g de proteína por unidade. Lanche prático para a bolsa.',i:'jar',img:'img/wheyfer-coco.jpg'},
 {n:'Barra de proteína Bold Doce de Leite, caixa com 12',c:'lanche',u:'https://meli.la/1ocEY3j',t:'Barra macia com 14g de proteína por unidade, sabor doce de leite.',i:'jar',img:'img/bold-doce-de-leite.jpg'},
 {n:'Barras de proteína Bold Caixa Mix, 12 unidades',c:'lanche',u:'https://meli.la/1upuE4Z',t:'Sabores variados numa caixa só, para não enjoar do lanche da semana.',i:'jar',img:'img/bold-caixa-mix.jpg'},
 {n:'Bold Tube Pistache, caixa com 12',c:'lanche',u:'https://meli.la/2hxKpQx',t:'Wafer em tubo recheado sabor pistache, com 10g de proteína por unidade.',i:'jar',img:'img/bold-tube-pistache.jpg'}
];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const used=CATS.filter(c=>P.some(x=>x.c===c.id));
const jump=document.getElementById('jump'),list=document.getElementById('list');
jump.innerHTML=used.map(c=>`<a href="#${c.id}" data-c="${c.id}">${esc(c.name)}</a>`).join('');
const card=x=>`<a class="card" href="${esc(x.u)}" target="_blank" rel="noopener sponsored"><div class="thumb"><img src="${esc(x.img)}" alt="${esc(x.n)}" loading="lazy"></div><h4>${esc(x.n)}</h4><p class="tip">${esc(x.t)}</p><span class="buy">Comprar</span></a>`;
let io;
const render=()=>{
 const html=used.map(c=>{
  const items=P.filter(x=>x.c===c.id);
  return items.length?`<section class="sec" id="${c.id}"><h3>${esc(c.name)}</h3><div class="grid">${items.map(card).join('')}</div></section>`:'';
 }).join('');
 list.innerHTML=html||'<p class="empty">Nenhum produto encontrado. Tente outra palavra.</p>';
 if(io)io.disconnect();
 io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){for(const a of jump.children)a.classList.toggle('on',a.dataset.c===e.target.id);const on=jump.querySelector('.on');if(on)jump.scrollTo({left:on.offsetLeft-jump.offsetLeft-14,behavior:'smooth'})}},{rootMargin:'-80px 0px -60% 0px'});
 list.querySelectorAll('.sec').forEach(s=>io.observe(s));
};
render();
}
</script>
</body>
</html>
